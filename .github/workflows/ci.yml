# Vérifie chaque push et chaque pull request : lint, types, tests, build Next,
# tests de bout en bout et Lighthouse (trois jobs en parallèle), puis
# construction de l'image Docker. Sur `main`, l'image est publiée sur GHCR et
# Coolify est prévenu : le VPS ne compile rien, il tire l'image.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Droits minimaux par défaut : les jobs qui exécutent le code d'une PR ne
# peuvent rien écrire. Le job « image » déclare les siens (publication GHCR).
permissions:
  contents: read

env:
  # URL du site, figée dans les pages au build (canonical, sitemap…).
  SITE_URL: https://jouan.dev

jobs:
  verifier:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Base de test : migrations appliquées puis tests d'intégration (verifier), e2e et Lighthouse (e2e).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jouan
          POSTGRES_PASSWORD: jouan
          POSTGRES_DB: jouan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jouan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jouan:jouan@127.0.0.1:5432/jouan_test
      DATABASE_URL_TEST: postgresql://jouan:jouan@127.0.0.1:5432/jouan_test
    steps:
      - uses: actions/checkout@v7

      # Lit la version de pnpm dans le champ `packageManager` du package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter web migrer

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Coulisses : nombre de tests passés, repris dans l'image (build-info.json).
      - name: Mesures des tests
        run: >-
          node apps/web/scripts/compter-tests.mjs vitest
          apps/web/.mesures/vitest.json apps/realtime/.mesures/vitest.json
          > mesures-verifier.json

      - uses: actions/upload-artifact@v7
        with:
          name: mesures-verifier
          path: mesures-verifier.json
          retention-days: 7

      - run: pnpm verifier-placeholders

      - run: pnpm build

  e2e:
    name: Bout en bout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Base de test : migrations appliquées puis tests d'intégration (verifier), e2e et Lighthouse.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jouan
          POSTGRES_PASSWORD: jouan
          POSTGRES_DB: jouan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jouan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jouan:jouan@127.0.0.1:5432/jouan_test
      DATABASE_URL_TEST: postgresql://jouan:jouan@127.0.0.1:5432/jouan_test
      # Service temps réel lancé par Playwright ; l'adresse est figée au build.
      NEXT_PUBLIC_DIRECT_URL: ws://127.0.0.1:3201/direct
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter web migrer

      - run: pnpm build

      - run: pnpm --filter realtime build

      - run: pnpm --filter web verifier-accueil-statique

      - run: pnpm --filter web semer-lien-exemple

      - run: pnpm --filter web exec playwright install --with-deps chromium

      - run: pnpm e2e

      - name: Mesures des tests de bout en bout
        run: node apps/web/scripts/compter-tests.mjs playwright apps/web/.mesures/playwright.json > mesures-e2e-tests.json

      - run: pnpm --filter web verifier-taille-encre

      - run: pnpm --filter web verifier-taille-direct

      - run: pnpm --filter web verifier-taille-defilement

      - run: pnpm --filter web verifier-taille-demo

      - run: pnpm --filter web verifier-taille-3d

      - run: pnpm --filter web verifier-taille-commandes

      - run: pnpm --filter web verifier-taille-a-propos

      - uses: actions/upload-artifact@v7
        with:
          name: mesures-e2e
          path: mesures-e2e-tests.json
          retention-days: 7

      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-e2e
          path: apps/web/playwright-report
          retention-days: 7

  # En parallèle des tests de bout en bout : son propre build et sa propre base,
  # pour ne pas attendre la fin de Playwright (près de 5 minutes).
  lighthouse:
    name: Performances (Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jouan
          POSTGRES_PASSWORD: jouan
          POSTGRES_DB: jouan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jouan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jouan:jouan@127.0.0.1:5432/jouan_test
      # Accueil mesuré avec le service temps réel, comme en production ; l'adresse est figée au build.
      NEXT_PUBLIC_DIRECT_URL: ws://127.0.0.1:3201/direct
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter web migrer

      - run: pnpm build

      - run: pnpm --filter realtime build

      # Lien personnalisé mesuré par Lighthouse (`/?pour=exemple-0000`).
      - run: pnpm --filter web semer-lien-exemple

      - name: Service temps réel
        run: |
          ORIGINES_AUTORISEES=http://127.0.0.1:3000 PORT=3201 HOTE=127.0.0.1 nohup pnpm --filter realtime start > /tmp/direct.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:3201/sante && exit 0; sleep 0.5; done
          cat /tmp/direct.log; exit 1

      - run: pnpm --filter web lighthouse

      - name: Mesures Lighthouse
        run: node apps/web/scripts/extraire-lighthouse.mjs apps/web/.lighthouseci/manifest.json > mesures-lighthouse.json

      - uses: actions/upload-artifact@v7
        with:
          name: mesures-lighthouse
          path: mesures-lighthouse.json
          retention-days: 7

      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-lighthouse
          path: apps/web/.lighthouseci
          # Sans cette option, upload-artifact ignore les dossiers cachés
          # (`.lighthouseci`) : les rapports manqueraient.
          include-hidden-files: true
          retention-days: 7

  image:
    name: Image Docker (${{ matrix.nom }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verifier, e2e, lighthouse]
    permissions:
      contents: read
      packages: write
    # Deux images : le site et le service temps réel (apps/realtime).
    # GHCR impose des noms en minuscules, d'où les noms en dur.
    strategy:
      matrix:
        include:
          - nom: site
            image: ghcr.io/augustin-jouan/jouan.dev
            dockerfile: Dockerfile
          - nom: temps-reel
            image: ghcr.io/augustin-jouan/jouan.dev-realtime
            dockerfile: apps/realtime/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # Coulisses : build-info.json (commit, date, tests, Lighthouse) avant le build
      # de l'image du site ; il entre dans le contexte Docker (non ignoré).
      - uses: actions/download-artifact@v8
        if: matrix.nom == 'site'
        with:
          pattern: mesures-*
          merge-multiple: true

      - uses: actions/setup-node@v7
        if: matrix.nom == 'site'
        with:
          node-version: 22

      - name: Infos du build pour les coulisses
        if: matrix.nom == 'site'
        run: >-
          node apps/web/scripts/assembler-build-info.mjs
          --verifier mesures-verifier.json --tests-e2e mesures-e2e-tests.json --lighthouse mesures-lighthouse.json
          > apps/web/build-info.json

      - uses: docker/setup-buildx-action@v4

      # Sur une PR, l'image est construite mais pas publiée.
      - name: Connexion à GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags de l'image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      # `SITE_URL` et `UMAMI_WEBSITE_ID` sont figés dans les pages au build :
      # ils doivent être connus ici, pas dans Coolify. L'identifiant Umami est
      # une variable de dépôt GitHub (Settings → Secrets and variables →
      # Actions → Variables). `NEXT_PUBLIC_DIRECT_URL` aussi (variable de
      # dépôt `DIRECT_URL`, par exemple `wss://direct.jouan.dev/direct`).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
            UMAMI_WEBSITE_ID=${{ vars.UMAMI_WEBSITE_ID }}
            NEXT_PUBLIC_DIRECT_URL=${{ vars.DIRECT_URL }}
          cache-from: type=gha,scope=${{ matrix.nom }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nom }}

  deployer:
    name: Déploiement Coolify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: image
    if: github.event_name == 'push'
    steps:
      # Coolify tire `latest` depuis GHCR et relance le conteneur. Les deux
      # secrets viennent de Coolify : l'URL du webhook de la ressource et un
      # jeton d'API (Keys & Tokens → API tokens). Tant qu'ils ne sont pas
      # définis, l'étape est simplement sautée.
      - name: Prévenir Coolify
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$TOKEN" ]; then
            echo "Secrets Coolify absents : déploiement non déclenché."
            exit 0
          fi
          curl --fail --silent --show-error \
            --request POST "$WEBHOOK_URL" \
            --header "Authorization: Bearer $TOKEN"

      - name: Prévenir Coolify (temps réel)
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL_DIRECT }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$TOKEN" ]; then
            echo "Secrets Coolify du service temps réel absents : déploiement non déclenché."
            exit 0
          fi
          curl --fail --silent --show-error \
            --request POST "$WEBHOOK_URL" \
            --header "Authorization: Bearer $TOKEN"
