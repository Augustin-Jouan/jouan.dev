# Vérifie chaque push et chaque pull request : lint, types, tests, build Next,
# puis construction de l'image Docker. Sur `main`, l'image est publiée sur
# GHCR et Coolify est prévenu : le VPS ne compile rien, il tire l'image.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deux valeurs à changer au démarrage d'un site (README, étape 9) :
env:
  # URL finale du site, figée dans les pages au build (canonical, sitemap…).
  SITE_URL: https://www.exemple.fr
  # GHCR impose un nom en minuscules, d'où le nom en dur plutôt que
  # `github.repository`.
  IMAGE: ghcr.io/augustin-jouan/site-vitrine-template

jobs:
  verifier:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

      # À décommenter au démarrage d'un site : bloque tant qu'un placeholder
      # « [...] » subsiste dans data/ ou app/. (Échoue exprès dans le template.)
      # - run: npm run verifier-placeholders

      - run: npm run build

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verifier
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Sur une PR, l'image est construite mais pas publiée.
      - name: Connexion à GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      # `SITE_URL` et `UMAMI_WEBSITE_ID` sont figés dans les pages au build :
      # ils doivent être connus ici, pas dans Coolify. L'identifiant Umami est
      # une variable de dépôt GitHub (Settings → Secrets and variables →
      # Actions → Variables).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
            UMAMI_WEBSITE_ID=${{ vars.UMAMI_WEBSITE_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deployer:
    name: Déploiement Coolify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: image
    if: github.event_name == 'push'
    steps:
      # Coolify tire `latest` depuis GHCR et relance le conteneur. Les deux
      # secrets viennent de Coolify : l'URL du webhook de la ressource et un
      # jeton d'API (Keys & Tokens → API tokens). Tant qu'ils ne sont pas
      # définis, l'étape est simplement sautée.
      - name: Prévenir Coolify
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$TOKEN" ]; then
            echo "Secrets Coolify absents : déploiement non déclenché."
            exit 0
          fi
          curl --fail --silent --show-error \
            --request POST "$WEBHOOK_URL" \
            --header "Authorization: Bearer $TOKEN"
